[package]
publish = false
name = "example-no-std"
version = "0.0.0"
edition = "2024"

[dependencies]
executorch = { path = "../../executorch/", default-features = false }
libc = { version = "0.2", default-features = false }
libc-print = "0.5"

[build-dependencies]
cc = "1.11"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
